<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Womanie - Your Complete Women's Health Companion</title>
    <meta name="description" content="Personalized health tracking that adapts to every stage of your reproductive journey - from first period through menopause" />
    <meta name="author" content="Womanie" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Night mode before first paint (same rule as src/lib/colorScheme.ts):
         Me -> Appearance choice on this device, else the system setting. -->
    <script>
      (function () {
        var p = 'auto';
        try { p = localStorage.getItem('womanie_color_scheme') || 'auto'; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#141012');
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Womanie" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG home-screen icons, so ship a real 180px PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Womanie - Your Complete Women's Health Companion" />
    <meta property="og:description" content="Personalized health tracking that adapts to every stage of your reproductive journey" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@womanie_health" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Idea 4 "Colour by stage": Figtree for everything (falls back to the
         system sans when offline); DM Mono only for the few small labels. -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Start the session check now, in parallel with the JS download;
         AuthProvider (src/contexts/AuthContext.tsx) picks this promise up. -->
    <script>
      try {
        var womanieMe = fetch('/api/auth/me', { credentials: 'include' });
        womanieMe.catch(function () {}); // offline: AuthProvider handles it, no "unhandled rejection" noise
        window.__womanieMe = womanieMe;
      } catch (e) { /* AuthProvider fetches instead */ }
    </script>
    <!-- Branded launch splash. Painted instantly from static HTML/CSS so
         the installed app (and a cold web load) opens on the Womanie mark
         and brand gradient instead of a blank white screen, then fades
         out once React mounts (removed in main.tsx). Matches the manifest
         background_color (#FDF8FC) / theme_color (#E8B4D8). -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #fdf8fc 0%, #f7e3f1 100%);
        transition: opacity 0.35s ease;
      }
      #app-splash.is-hidden { opacity: 0; pointer-events: none; }
      /* Night mode: warm near-black, no bright flash at 3 am. */
      html.dark #app-splash { background: #141012; }
      html.dark #app-splash img { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
      #app-splash img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(232, 180, 216, 0.45);
        animation: app-splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
      }
    </style>
    <div id="app-splash" aria-hidden="true">
      <img src="/apple-touch-icon.png" alt="" width="88" height="88" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
